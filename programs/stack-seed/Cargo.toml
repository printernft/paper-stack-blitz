[package]
name = "stack-seed"
version = "0.1.0"
edition = "2021"

[lib]
name = "stack_seed"
crate-type = ["cdylib", "lib"]

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "=1.0.2"
ephemeral-rollups-sdk = { version = "=0.18.0", features = ["anchor", "vrf"] }
